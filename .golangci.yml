version: "2"

# Run locally: golangci-lint run ./...
# CI runs the same command (see .github/workflows/ci.yml).
run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet # type-ish checks: printf verbs, struct tags, unreachable, etc.
    - ineffassign # dead assignments (often signal wrong variable / logic slip)
    - misspell
    # NOTE (debt, 2026-09-27): staticcheck (15 hits) and unused (28 hits,
    # mostly *WithAlias variants in services/resolve_min.go) are intentionally
    # OFF until the backlog is cleaned. Enable by adding them below and
    # running: golangci-lint run ./...
    #   - staticcheck
    #   - unused

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 20
